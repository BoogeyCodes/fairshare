{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>FairShare</h1>
  <p class="muted">Track shared expenses and settle up with the fewest payments.</p>
  {% if mode == 'register' %}
    <form method="post" action="/register" class="stack">
      <label>Name<input name="display_name" required placeholder="Ada Lovelace"></label>
      <label>Email<input name="email" type="email" required placeholder="ada@example.com"></label>
      <label>Password<input name="password" type="password" minlength="8" required></label>
      <button class="primary">Create account</button>
    </form>
    <p class="muted">Already have an account? <a href="/">Log in</a></p>
  {% else %}
    <form method="post" action="/login" class="stack">
      <label>Email<input name="email" type="email" required placeholder="ada@example.com"></label>
      <label>Password<input name="password" type="password" required></label>
      <button class="primary">Log in</button>
    </form>
    <p class="muted">New here? <a href="/register">Create an account</a></p>
  {% endif %}
</div>
{% endblock %}
