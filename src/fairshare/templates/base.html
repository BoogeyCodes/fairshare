<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FairShare{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Fair<span>Share</span></a>
    <nav>
      {% if user %}
        <span class="muted">{{ user.display_name }}</span>
        <form method="post" action="/logout" class="inline"><button class="link">Log out</button></form>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% if request.query_params.get('error') %}
      <div class="alert">{{ request.query_params.get('error') }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
